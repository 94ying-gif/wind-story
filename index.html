<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layered Story Quest · 繪本層次探索與後台中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@insforge/sdk@latest/dist/insforge.min.js"></script>
    <style>
        body {
            background-color: #0d0714;
            color: #f3ecff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .bg-card { background-color: rgba(255, 255, 255, 0.05); }
        .border-glow { border-color: rgba(168, 85, 247, 0.35); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex items-center justify-center">

    <div class="max-w-xl w-full bg-card border border-glow backdrop-blur-md rounded-2xl p-6 md:p-8 space-y-6 shadow-2xl">
        
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-bold text-purple-300">Layered Story Quest</h1>
            <p class="text-sm text-purple-200/80">De5ign 書坊 · 繪本層次探索與教案後台中心</p>
        </div>

        <div id="login-section" class="space-y-4">
            <div class="p-4 bg-purple-950/40 rounded-xl border border-purple-500/20 text-center space-y-2">
                <p class="text-sm text-purple-200">登入後即可解鎖以下功能：</p>
                <ul class="text-xs text-purple-300/80 space-y-1">
                    <li>✨ 跨裝置同步《那天風很大》教學紀錄</li>
                    <li>💾 雲端儲存學生 ORID 漢堡王提問記錄與作業</li>
                    <li>⭐️ 收藏各星級教學方案</li>
                </ul>
            </div>

            <button onclick="loginWithGmail()" class="w-full py-3.5 px-4 bg-white hover:bg-slate-100 text-slate-900 font-bold rounded-xl flex items-center justify-center gap-3 transition shadow-lg">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                使用 Gmail 帳號登入
            </button>
        </div>

        <div id="dashboard-section" class="hidden space-y-6">
            <div class="flex items-center gap-4 p-4 bg-black/30 rounded-xl border border-white/10">
                <div class="w-12 h-12 rounded-full bg-purple-600 flex items-center justify-center font-bold text-xl text-white" id="user-avatar">
                    G
                </div>
                <div>
                    <p class="font-bold text-purple-200" id="user-name">載入中...</p>
                    <p class="text-xs text-purple-300/70" id="user-email">email@gmail.com</p>
                </div>
            </div>

            <div class="space-y-3">
                <h3 class="font-bold text-purple-300 border-l-4 border-purple-500 pl-2">資料庫存取測試（InsForge DB）</h3>
                <div class="space-y-2">
                    <label class="text-xs text-purple-200">課堂備註 / 學習單心得儲存：</label>
                    <textarea id="noteInput" rows="3" class="w-full p-3 bg-black/40 border border-white/10 rounded-xl text-sm focus:outline-none focus:border-purple-500 text-purple-100" placeholder="輸入要同步至資料庫的內容..."></textarea>
                </div>
                <button onclick="saveToDatabase()" class="w-full py-2.5 bg-purple-600 hover:bg-purple-500 font-bold text-white rounded-xl text-sm transition shadow-md">
                    💾 寫入 InsForge 資料庫
                </button>
            </div>

            <div class="p-3 bg-black/60 rounded-xl border border-white/5 space-y-1">
                <p class="text-xs font-mono text-purple-400">InsForge Console Log:</p>
                <p id="logOutput" class="text-xs font-mono text-emerald-400">系統就緒，等待操作...</p>
            </div>

            <button onclick="logout()" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-purple-300 font-medium rounded-xl text-xs transition">
                安全登出
            </button>
        </div>

    </div>

    <script>
        const INSFORGE_URL = "https://763wx989.us-west-2.insforge.app";
        const INSFORGE_API_KEY = "ik_xxxxxxxxxxxxxxxx"; 

        let insforgeClient = null;
        if (window.InsForge) {
            insforgeClient = window.InsForge.createClient(INSFORGE_URL, INSFORGE_API_KEY);
        }

        async function loginWithGmail() {
            log("正在連線至 InsForge Auth 進行 Google 驗證...");
            if (!insforgeClient) {
                setTimeout(() => {
                    showDashboard({
                        name: "測試教師",
                        email: "user.teacher@gmail.com",
                        picture: "T"
                    });
                    log("【模擬模式】已使用 Google 帳號成功登入！");
                }, 800);
                return;
            }
            try {
                const { data, error } = await insforgeClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: { redirectTo: window.location.href }
                });
                if (error) throw error;
            } catch (err) {
                log("登入失敗：" + err.message);
            }
        }

        async function saveToDatabase() {
            const text = document.getElementById("noteInput").value;
            if (!text) {
                alert("請輸入內容！");
                return;
            }
            log("正在將資料寫入 InsForge Database...");
            if (!insforgeClient) {
                setTimeout(() => {
                    log("【模擬成功】資料已成功 Insert 至資料庫表！");
                    alert("儲存成功！");
                    document.getElementById("noteInput").value = "";
                }, 600);
                return;
            }
            try {
                const { data, error } = await insforgeClient
                    .from('teacher_notes')
                    .insert([{ content: text, created_at: new Date() }]);
                if (error) throw error;
                log("成功寫入資料庫！");
                alert("備註已成功儲存至雲端資料庫！");
                document.getElementById("noteInput").value = "";
            } catch (err) {
                log("寫入失敗：" + err.message);
            }
        }

        async function logout() {
            if (insforgeClient) {
                await insforgeClient.auth.signOut();
            }
            document.getElementById("login-section").classList.remove("hidden");
            document.getElementById("dashboard-section").classList.add("hidden");
            log("已登出系統。");
        }

        function showDashboard(user) {
            document.getElementById("login-section").classList.add("hidden");
            document.getElementById("dashboard-section").classList.remove("hidden");
            document.getElementById("user-name").innerText = user.name;
            document.getElementById("user-email").innerText = user.email;
            document.getElementById("user-avatar").innerText = user.picture || "G";
        }

        function log(msg) {
            document.getElementById("logOutput").innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
        }
    </script>
</body>
</html>
